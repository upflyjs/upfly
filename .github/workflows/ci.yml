name: CI

on:
  push:
    # The rewrite lives on `v3` until it becomes `main` at launch, so CI watches both.
    branches: [main, v3]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: the previous generation's worst shipped
        # bug was platform-specific, so it is tested on every commit, not before release.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Every scanned file is held to the comment standard, and one finding fails the job.
      - name: Comments
        run: pnpm comments:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  accuracy-suite:
    # The answer key and the tree are one instrument: a key that has drifted from the tree
    # still reads green, and the measuring harness refuses to run until they agree. `check`
    # says they agree; `prove` then builds the packages, damages copies of them one way at a
    # time and confirms a check fails each time, because a check never seen to fail proves
    # nothing. `measure` runs the engine over the tree twice, with the suite's configuration
    # and with none; it fails on any defect in either run, since both figures are published.
    #
    # Two cells, not six: the key records byte offsets, which match on every platform only
    # because git converts no line endings in the suite (its `.gitattributes` is `-text`).
    # The Windows cell is where a converted checkout would show; the other four would re-read
    # the same bytes.
    name: accuracy suite self-check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Key and tree agree
        run: pnpm accuracy:check

      - name: And the check can still fail
        run: pnpm accuracy:prove

      - name: Measure the engine against the key
        run: pnpm accuracy:measure

  coverage:
    name: coverage gate (core >= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The check jobs get `dist` from `pnpm typecheck`, which runs `tsc --build --force`.
      # This job does not typecheck, and `packages/core/test/smoke.test.ts` loads the built
      # package, so it builds first.
      - run: pnpm build
      # Thresholds live in vitest.config.ts; this job fails if core drops below them.
      - run: pnpm coverage

  bench:
    # A performance claim is only ever a number this job produced. It gates on a regression
    # ceiling per platform (`budget`, in ms), set about 30% above the slowest run measured
    # on unchanged code, because the headline drifts by up to about 22% between runs. The
    # ceiling is not the 3,000 ms design target, which the engine does not meet; the output
    # prints both. It catches a regression above about 30% and cannot see a 10% one: for
    # that, compare two builds back to back with `bench/src/noise.ts`. See "The gate is a
    # regression ceiling, not the target" in bench/README.md.
    name: bench (gate) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            budget: 5500
          - os: windows-latest
            budget: 7500
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Graph budget across three invocations
        # Three separate processes, each the median of three runs after a discarded warm-up:
        # sampling inside one process controls the file-system cache and nothing else. Three
        # invocations catch a machine having a bad day but understate the spread, so the
        # ceiling comes from run-to-run figures instead.
        env:
          UPFLY_BENCH_BUDGET_MS: ${{ matrix.budget }}
        # The run also prints a per-step breakdown (discover, scan with read against parse,
        # resolve, graph), each step sampled in three processes with a median, a spread, and
        # `unusable` beside a step whose samples disagree. Read it to say which step moved,
        # never as a figure: drift between runs cannot be seen from inside one run, and the
        # breakdown prints that warning itself. `--experiments` is left off, since it adds
        # about four minutes to a Windows run; it still works locally. The graph is built 18
        # times, 12 for the headline and 6 for the breakdown. This is the `bench:gate` script.
        run: pnpm --filter upfly-bench run bench -- --graph-only --invocations=3 --runs=3

  build:
    name: build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify publishable output exists
        run: |
          test -f packages/core/dist/index.js || { echo "::error::core did not build"; exit 1; }
          test -f packages/core/dist/index.d.ts || { echo "::error::core types missing"; exit 1; }
          test -f packages/cli/dist/bin.js || { echo "::error::cli bin did not build"; exit 1; }
          test -f packages/mcp/dist/bin.js || { echo "::error::mcp bin did not build"; exit 1; }

  packed-install:
    # The packages as npm will publish them, installed where a user installs them: each
    # tarball must hold every file its `files` list names, and the installed `upfly` must
    # print its version, audit a fixture with JSON the schemas it shipped accept, and write,
    # commit and undo a run, with no MCP library in its install. The installed `upfly-mcp`,
    # started through npx as a client starts it, must answer as `upfly` does. The proof the
    # dropped beta was for, on every platform.
    name: packed install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Packs the three packages into the runner's temporary folder, installs the tarballs
      # into an empty folder there with npm, and runs the installed binaries through npx.
      - name: Pack, install and run
        run: node tools/packed-install.mjs

  fixture-build:
    # A real build survives `optimize --apply --commit` through the built binary, under both
    # policies: each fixture in a repository of its own and inside a larger one, applied,
    # committed, built by its own framework, link-checked, reverted and undone. Linux only:
    # the fixtures build several times per policy, and the check job already runs the CLI's
    # tests on every platform. See "The fixture build" in bench/README.md.
    name: fixture build through the CLI / ubuntu-latest
    runs-on: ubuntu-latest
    env:
      # The frameworks' own usage reports, which are theirs, not Upfly's.
      NEXT_TELEMETRY_DISABLED: 1
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Originals kept
        run: pnpm --filter upfly-bench run fixture-build -- --cli
      - name: Originals replaced
        run: pnpm --filter upfly-bench run fixture-build -- --cli --replace

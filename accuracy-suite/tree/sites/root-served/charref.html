<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Currency marks</title>
  </head>
  <body>
    <!--
      HTML reads a numeric reference from 128 to 159 as the Windows-1252 character with
      that number, not as a C1 control, so both spellings below name the euro sign.
    -->
    <img src="marks/&#128;uro.png" alt="The euro mark, as a decimal reference" />
    <img src="marks/&#x80;uro.png" alt="The same mark, as a hexadecimal reference" />
    <img src="marks/%E2%82%ACuro.png" alt="The same mark, as its UTF-8 percent-escapes" />
  </body>
</html>
